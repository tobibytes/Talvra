[project]
name = "talvra-extract"
version = "0.1.0"
description = "Turns course files (PDF, DOCX, PPTX, HTML, text) into Markdown with page/slide anchors."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pypdfium2==5.14.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "beautifulsoup4==4.15.0",
  "markdownify==1.2.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.16.0", "fpdf2==2.8.9", "ruff==0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
