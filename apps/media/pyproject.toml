[project]
name = "talvra-media"
version = "0.1.0"
description = "Renders narrated study videos (slides + audio) with Pillow and ffmpeg."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.16.0", "ruff==0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
