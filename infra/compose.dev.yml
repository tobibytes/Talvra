# Local Postgres for Talvra v2. Production uses Neon through Cloudflare Hyperdrive.
# The password below is a throwaway local default, not a real credential. The port
# is bound to 127.0.0.1 so the database is never reachable from the network
# (e.g. campus Wi-Fi), only from this machine.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: talvra
      POSTGRES_PASSWORD: talvra
      POSTGRES_DB: talvra
    volumes:
      - talvra-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talvra"]
      interval: 2s
      retries: 20
volumes:
  talvra-pg:
