# Local Postgres for Talvra v2. Production uses Neon through Cloudflare Hyperdrive.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: talvra
      POSTGRES_PASSWORD: talvra
      POSTGRES_DB: talvra
    volumes:
      - talvra-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talvra"]
      interval: 2s
      retries: 20
volumes:
  talvra-pg:
